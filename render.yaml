services:
  - type: web
    name: subsight-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: ENV
        value: production
      - key: DEMO_MODE
        value: "true"
      - key: STORAGE_BACKEND
        value: r2
      - key: DATABASE_URL
        fromDatabase:
          name: subsight-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_BASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.9"

databases:
  - name: subsight-db
    plan: free
    region: singapore
    databaseName: subsight
    user: subsight
